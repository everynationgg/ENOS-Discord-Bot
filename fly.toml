# fly.toml app configuration file for ENOS Discord Bot

app = "enos-discord-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  BOT_TIMEZONE = "Asia/Manila"

# A Discord bot must run as exactly ONE instance.
# Two instances = two gateway connections = interaction failures.
[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  count = 1
